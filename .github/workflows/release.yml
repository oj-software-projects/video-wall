name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Make universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/video-wall-macos-universal \
            target/aarch64-apple-darwin/release/video-wall \
            target/x86_64-apple-darwin/release/video-wall
          chmod +x dist/video-wall-macos-universal
          lipo -archs dist/video-wall-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: video-wall-macos-universal
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libwayland-dev pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/release/video-wall dist/video-wall-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: video-wall-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64
      - run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/video-wall.exe dist/video-wall-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: video-wall-windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
