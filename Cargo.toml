[package]
name = "video-wall"
version = "0.1.4"
edition = "2021"
description = "video-wall - Multi-Video Player"

[dependencies]
wry = { version = "0.53", features = ["devtools"] }
tao = "0.34"
rfd = "0.15"
tiny_http = "0.12"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
